[package]
name = "environment-variable-manager"
version = "0.1.4"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "backup", "collation"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Time", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_Security", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
