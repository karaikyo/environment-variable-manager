name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([0-9.]+)"\r?$').Groups[1].Value
          if (-not $version) { throw 'Missing package version' }
          if ($env:EVENT_NAME -eq 'push' -and $env:REF_NAME -cne "v$version") { throw 'Tag must match Cargo.toml' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          rustc --version
          cargo --version
      - name: Fetch locked dependencies on the disposable runner
        run: |
          cargo --config net.offline=false fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Dependency fetch failed' }
      - name: Run headless functional tests
        run: |
          $suites = @('browse','create_delete','edits','history','lifecycle','observation','recovery','resume','startup','system_edits','updates','windows_registry','icons')
          $arguments = @('test','--offline','--locked')
          foreach ($suite in $suites) { $arguments += @('--test',$suite) }
          & ./scripts/cargo.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Functional tests failed' }
      - name: Verify package contract
        run: ./scripts/test-package.ps1
      - name: Build and inspect assets
        run: ./scripts/ci-release.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-release
          path: release-assets
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Portable Windows 11 x64 preview. Extract the ZIP into a writable folder and run the executable.
          For updates, Exit the app, replace application files, and preserve data/.
          CI functional tests and package/privacy checks passed. Native UI, UAC, actual power transitions and other controlled manual acceptance remain separate checks.
          A SHA-256 checksum is attached.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 --verify-tag --title "$RELEASE_TAG (Preview)" --prerelease --notes-file release-notes.md
